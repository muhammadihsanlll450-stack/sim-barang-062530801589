<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIM-Barang</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="Beranda">
    <h1>SIM-Barang</h1>
    <nav>
      <ul>
        <li><a href="#Beranda">Beranda</a></li>
        <li><a href="#inventaris">Data Barang</a></li>
        <li><a href="#form-barang">Tambah Barang</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="inventaris">
      <h2>Tabel Inventaris Barang</h2>
      <input type="text" id="cari" placeholder="Cari barang...">
      <table id="tabel-barang">
        <thead>
          <tr>
            <th>Kode</th>
            <th>Nama Barang</th>
            <th>Kategori</th>
            <th>Jumlah</th>
            <th>Kondisi</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>BRG-001</td>
            <td>Proyektor</td>
            <td>Elektronik</td>
            <td>3</td>
            <td>Baik</td>
          </tr>
          <tr>
            <td>BRG-002</td>
            <td>Meja Lab</td>
            <td>Furnitur</td>
            <td>20</td>
            <td>Baik</td>
          </tr>
          <tr>
            <td>BRG-003</td>
            <td>Kursi Putar</td>
            <td>Furnitur</td>
            <td>15</td>
            <td>Rusak</td>
          </tr>
        </tbody>
      </table>
    </section>

    <section id="form-barang">
      <h2>Form Input Barang</h2>
      <form id="form-barang-input" action="#" method="post" novalidate>
        <label for="kode">Kode Barang</label>
        <input type="text" id="kode" name="kode" placeholder="BRG-001" required>

        <label for="nama">Nama Barang</label>
        <input type="text" id="nama" name="nama" placeholder="Contoh: Proyektor" required>

        <label for="kategori">Kategori</label>
        <select id="kategori" name="kategori" required>
          <option value="">-- Pilih --</option>
          <option value="elektronik">Elektronik</option>
          <option value="furnitur">Furnitur</option>
          <option value="alat-tulis">Alat Tulis</option>
        </select>

        <label for="jumlah">Jumlah</label>
        <input type="number" id="jumlah" name="jumlah" min="1" required>

        <label for="kondisi">Kondisi</label>
        <select id="kondisi" name="kondisi" required>
          <option value="">-- Pilih --</option>
          <option value="baik">Baik</option>
          <option value="rusak">Rusak</option>
        </select>

        <button type="submit">Simpan</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 SIM-Barang - M.Ihsan (062530801589)</p>
  </footer>

  <div id="toast" class="toast" hidden></div>
  <script src="main.js"></script>
</body>
</html>
